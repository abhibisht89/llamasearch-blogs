<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>The Sandbox — Run Python in Your Browser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --serif: 'Source Serif 4 Variable', Georgia, 'Times New Roman', serif;
  --bg: #0a0a0f;
  --bg-nav: rgba(10,10,15,0.92);
  --bg-card: #12121a;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-dim: #8888a0;
  --accent: #6c8cff;
  --green: #34d399;
  --radius: 12px;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'Inter Variable', system-ui, 'Segoe UI', sans-serif;
}

[data-theme="light"] {
  --bg: #f5f5f8; --bg-card: #ffffff;
  --bg-nav: rgba(245,245,248,0.95); --border: #dddde8;
  --text: #1a1a2e; --text-dim: #5a5a7a;
  --accent: #3d5ce0; --green: #0f9a6a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.7;
  font-size: 16px;
  overflow-x: hidden;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

body { padding-top: 44px !important; }

/* ── Hero ── */
.hero {
  padding: 80px 24px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(52,211,153,0.12) 0%, rgba(108,140,255,0.06) 40%, transparent 70%);
  pointer-events: none;
}
.hero h1 {
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  font-weight: 800;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}
.hero p {
  font-size: 1rem;
  color: var(--text-dim);
  max-width: 480px;
  margin: 0 auto;
}
.hero .shortcut-hint {
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text-dim);
}
.hero .shortcut-hint kbd {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 0.72rem;
}

/* ── Playground Container ── */
.playground {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px 100px;
}
</style>
<link rel="stylesheet" href="/_shared/asknex-type.css">

<style class="breadcrumb-styles">
.breadcrumb-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: var(--bg-nav); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 24px; font-size: 0.85rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; flex-wrap: nowrap; gap: 2px; font-family: var(--sans); }
.breadcrumb-nav a { color: var(--accent); text-decoration: none; white-space: nowrap; flex-shrink: 0; }
.breadcrumb-nav a:hover { text-decoration: underline; }
.breadcrumb-nav .bc-sep { margin: 0 8px; color: var(--text-dim); flex-shrink: 0; }
.breadcrumb-nav .bc-current { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.theme-toggle { margin-left: auto; flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text-dim); cursor: pointer; }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.theme-toggle svg { width: 15px; height: 15px; fill: currentColor; }
.icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: block; }
</style>
<script>(function(){ var t = localStorage.getItem('tcw-theme'); if (t === 'light') document.documentElement.setAttribute('data-theme','light'); })();</script>
</head>
<body>

<nav class="breadcrumb-nav"><a href="../">The Context Window</a><span class="bc-sep">›</span><span class="bc-current">The Sandbox</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
</nav>

<div class="hero">
  <h1>The Sandbox</h1>
  <p>Write and run Python code right in your browser. No setup needed.</p>
  <div class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run &nbsp;·&nbsp; <kbd>Tab</kbd> to indent</div>
</div>

<div class="playground" id="editor-mount"></div>

<script src="codemirror-bundle.js"></script>
<script src="pyrunner.js"></script>
<script>
  var api = PyRunner.createPanel({
    initialCode: "# Write your Python code here\n\nprint('Hello, world!')\n"
  });
  document.getElementById('editor-mount').appendChild(api.panel);
  api.ensureEditor();
</script>


<script>
(function(){
  var btn = document.getElementById('themeToggle');
  var root = document.documentElement;
  if (!btn) return;
  btn.addEventListener('click', function(){
    var isLight = root.getAttribute('data-theme') === 'light';
    if (isLight) { root.removeAttribute('data-theme'); localStorage.setItem('tcw-theme','dark'); }
    else { root.setAttribute('data-theme','light'); localStorage.setItem('tcw-theme','light'); }
  });
})();
</script>
