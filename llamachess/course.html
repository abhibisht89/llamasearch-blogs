<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Course — LlamaChess</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .london-lines {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .london-line-card {
      display: block;
      padding: 18px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .london-line-card:hover {
      border-color: var(--accent);
    }
    .line-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .line-card-actions .btn,
    .london-line-card > .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
    }
    .london-line-card.studied { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    .london-line-card.attempted { opacity: 0.92; }
    .london-line-num {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .london-line-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 14px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Breadcrumb">
    <div class="top-nav-inner">
      <a class="breadcrumb-link" href="../">The Context Window</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link logo" href="index.html">Llama<span>Chess</span></a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link" href="repertoire.html">Line Kitchen</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current" id="breadcrumb-title">Course</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73.71.71M3 12H2m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"/></svg>
    </button>
  </nav>

  <div class="container">
    <section class="hero hero-sub">
      <span class="page-tag" id="course-tag">Repertoire</span>
      <h1 id="course-title">Opening</h1>
      <p id="course-description"></p>
    </section>

    <div class="filter-row">
      <span class="filter-label">All lines</span>
      <button id="reset-btn" class="filter-btn" style="margin-left:auto">Reset progress</button>
    </div>

    <div id="line-grid" class="london-lines"></div>
  </div>

  <script src="js/theme.js"></script>
  <script type="module" src="js/repertoire-course.js"></script>
</body>
</html>
