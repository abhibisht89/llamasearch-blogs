<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line Kitchen — LlamaChess</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .rep-course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .rep-course-card {
      display: block;
      padding: 22px 24px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .rep-course-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
    }
    .rep-course-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .rep-course-link:hover {
      text-decoration: none;
    }
    .rep-tier-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .rep-tier-tab {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .rep-tier-tab.is-active {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .rep-tier-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .rep-tier-potluck {
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .rep-course-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .rep-course-color { color: var(--accent); }
    .rep-course-lines { color: var(--muted); }
    .rep-course-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 10px;
      line-height: 1.25;
    }
    .rep-course-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 14px;
    }
    .rep-course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .rep-course-tag {
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .rep-course-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 8px;
    }
    .rep-course-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      min-width: 0;
      transition: width 0.3s;
    }
    .rep-course-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .hub-tagline {
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 600;
      margin: -8px 0 12px;
    }
    .rep-toolbar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .rep-filter-wrap {
      position: relative;
    }
    .rep-filter-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--sans);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .rep-filter-toggle:hover,
    .rep-filter-toggle[aria-expanded="true"] {
      border-color: var(--accent);
    }
    .rep-filter-toggle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .rep-filter-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 20;
      min-width: 180px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
    }
    .rep-filter-panel[hidden] {
      display: none;
    }
    .rep-filter-group-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .rep-filter-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 0.88rem;
      color: var(--text-dim);
      cursor: pointer;
    }
    .rep-filter-option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .rep-filter-option:has(input:checked) {
      color: var(--text);
    }
    .rep-search-wrap {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      transition: border-color 0.2s;
    }
    .rep-search-wrap:focus-within {
      border-color: var(--accent);
    }
    .rep-search-wrap svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: var(--text-dim);
      fill: none;
      stroke-width: 2;
    }
    .rep-search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--sans);
      outline: none;
    }
    .rep-search-wrap input::placeholder {
      color: var(--text-dim);
    }
    .rep-empty {
      grid-column: 1 / -1;
      padding: 32px 20px;
      text-align: center;
      color: var(--text-dim);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    .rep-section {
      margin-top: 36px;
    }
    .rep-section:first-of-type {
      margin-top: 0;
    }
    .rep-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .rep-section-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin: 0;
    }
    .rep-section-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0;
    }
    .rep-potluck-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      margin-left: 8px;
      vertical-align: middle;
    }
    .rep-depth-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .rep-depth-deep {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
      color: var(--accent);
    }
    .rep-depth-quick {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Breadcrumb">
    <div class="top-nav-inner">
      <a class="breadcrumb-link" href="../">The Context Window</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link logo" href="index.html">Llama<span>Chess</span></a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Line Kitchen</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73.71.71M3 12H2m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"/></svg>
    </button>
  </nav>

  <div class="container">
    <section class="hero hero-sub">
      <span class="page-tag">Repertoire</span>
      <h1 id="hub-title">Line Kitchen</h1>
      <p class="hub-tagline" id="hub-tagline">Walk the lines. Cook your opponents.</p>
      <p id="hub-description">Interactive opening repertoires with casual move-by-move notes.</p>
      <div class="section-stats" id="hub-stats"></div>
    </section>

    <div class="rep-toolbar">
      <div class="rep-filter-wrap">
        <button
          type="button"
          id="filter-toggle"
          class="rep-filter-toggle"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M7 12h10M10 18h4"/>
          </svg>
          Filters
        </button>
        <div id="filter-panel" class="rep-filter-panel" hidden>
          <span class="rep-filter-group-label">Color</span>
          <label class="rep-filter-option">
            <input type="checkbox" id="filter-white" checked />
            White
          </label>
          <label class="rep-filter-option">
            <input type="checkbox" id="filter-black" checked />
            Black
          </label>
        </div>
      </div>
      <label class="rep-search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-4-4"/>
        </svg>
        <input type="search" id="course-search" placeholder="Search" aria-label="Search openings" />
      </label>
    </div>

    <div class="rep-tier-tabs" role="toolbar" aria-label="Course tiers">
      <button type="button" class="rep-tier-tab is-active" data-tier-tab="all" aria-pressed="true">All</button>
      <button type="button" class="rep-tier-tab" data-tier-tab="official" aria-pressed="false">
        House Menu · <span id="tier-official-count">28</span>
      </button>
      <button type="button" class="rep-tier-tab" data-tier-tab="potluck" aria-pressed="false">
        Potluck · <span id="tier-potluck-count">60</span>
      </button>
    </div>

    <div id="course-sections"></div>
  </div>

  <script src="js/theme.js"></script>
  <script type="module" src="js/repertoire-collection.js"></script>
</body>
</html>
