<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drill — Line Kitchen</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/board-themes.css" />
  <link rel="stylesheet" href="vendor/chessground/assets/chessground.base.css" />
  <link rel="stylesheet" href="vendor/chessground/assets/chessground.cburnett.css" />
  <script type="importmap">
  {
    "imports": {
      "chess.js": "./vendor/chess.js/dist/esm/chess.js",
      "@lichess-org/chessground": "./vendor/chessground/dist/chessground.js"
    }
  }
  </script>
  <style>
    #board { width: 100%; aspect-ratio: 1; }
    .drill-progress {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Breadcrumb">
    <div class="top-nav-inner">
      <a class="breadcrumb-link" href="../">The Context Window</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link logo" href="index.html">Llama<span>Chess</span></a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link" href="repertoire.html">Line Kitchen</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link" id="collection-back" href="#">Course</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Drill</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73.71.71M3 12H2m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"/></svg>
    </button>
  </nav>

  <div class="container solve-page">
    <div class="solve-layout">
      <div class="solve-main">
        <div class="board-wrap theme-brown">
          <div id="board"></div>
        </div>
        <div id="status-msg" class="status-msg idle" style="margin-top:16px">
          Loading line…
        </div>
        <button id="start-btn" class="btn btn-primary" type="button" style="margin-top:12px;display:none">
          Start line
        </button>
      </div>

      <aside class="solve-sidebar">
        <div class="info-card">
          <span class="mode-badge">Drill mode</span>
          <p class="lesson-label">Line</p>
          <h1 id="lesson-title" class="lesson-heading"></h1>
          <p id="lesson-sub" class="lesson-subtitle"></p>
          <p id="drill-progress" class="drill-progress" aria-live="polite"></p>
          <p id="side-to-move" class="side-to-move" aria-live="polite"></p>
        </div>

        <div class="info-card theory-card">
          <h2>Hint</h2>
          <h3 id="hint-title" class="theory-step-title"></h3>
          <p id="hint-body" class="theory-body"></p>
        </div>

        <div class="info-card">
          <h2>Board theme</h2>
          <div class="theme-switch">
            <button type="button" class="theme-btn active" data-theme="brown">
              <span class="theme-swatch brown"></span>
              Brown
            </button>
            <button type="button" class="theme-btn" data-theme="green">
              <span class="theme-swatch green"></span>
              Green
            </button>
            <button type="button" class="theme-btn" data-theme="blue">
              <span class="theme-swatch blue"></span>
              Blue
            </button>
          </div>
        </div>

        <div class="nav-row">
          <a id="prev-lesson" class="btn btn-ghost" href="#">← Prev line</a>
          <a id="next-lesson" class="btn btn-ghost" href="#">Next line →</a>
        </div>

        <div class="mode-switch">
          <a id="study-link" class="btn" href="#">Study mode</a>
          <span class="btn active" aria-current="page">Drill mode</span>
        </div>

        <button id="hint-btn" class="btn btn-ghost btn-block" type="button">Show hint</button>

        <button id="reset-btn" class="btn btn-primary btn-block" type="button">Reset line</button>
      </aside>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script type="module" src="js/opening-drill.js"></script>
</body>
</html>
