<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mate in 3 — LlamaChess</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "chess.js": "./vendor/chess.js/dist/esm/chess.js"
    }
  }
  </script>
</head>
<body>
  <nav class="top-nav" aria-label="Breadcrumb">
    <div class="top-nav-inner">
      <a class="breadcrumb-link" href="../">The Context Window</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link logo" href="index.html">Llama<span>Chess</span></a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <a class="breadcrumb-link" href="collection.html">Polgar Collection</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span class="breadcrumb-current">Mate in 3</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73.71.71M3 12H2m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"/></svg>
    </button>
  </nav>

  <div class="container">
    <div class="page-actions">
      <a id="continue-btn" class="btn btn-primary" href="#">Start training</a>
    </div>

    <div class="section-header">
      <h1 id="section-title">Mate in 3</h1>
      <p id="section-desc"></p>
      <div class="section-stats" id="section-stats"></div>
      <div class="progress-bar-wrap" style="margin-top:12px;max-width:320px">
        <div id="header-progress" class="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="unsolved">Unsolved</button>
      <button class="filter-btn" data-filter="solved">Solved</button>
      <button id="reset-btn" class="filter-btn" style="margin-left:auto">Reset progress</button>
    </div>

    <nav id="pagination" class="pagination" aria-label="Puzzle pages" hidden></nav>

    <div id="puzzle-grid" class="puzzle-grid"></div>
  </div>

  <script src="js/theme.js"></script>
  <script type="module" src="js/mate-in-3.js"></script>
</body>
</html>
