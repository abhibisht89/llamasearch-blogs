<html lang="en">

<title>The Paper Trail — Curated Research Papers</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-alt: #181825;
  --bg-nav: rgba(10,10,15,0.92);
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-dim: #8888a0;
  --accent: #6c8cff;
  --accent2: #a78bfa;
  --accent3: #34d399;
  --accent4: #f472b6;
  --accent5: #fbbf24;
  --danger: #f87171;
  --radius: 12px;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
[data-theme="light"] {
  --bg: #f5f5f8; --bg-card: #ffffff; --bg-card-alt: #ededf4;
  --bg-nav: rgba(245,245,248,0.95); --border: #dddde8;
  --text: #1a1a2e; --text-dim: #5a5a7a;
  --accent: #3d5ce0; --accent2: #7040c0; --accent3: #0f9a6a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.7;
  font-size: 16px;
  overflow-x: hidden;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); background: var(--bg-card-alt); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: var(--accent); }

/* ── Hero ── */
.hero {
  padding: 80px 24px 40px; text-align: center;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -200px; left: 50%;
  transform: translateX(-50%); width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(108,140,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin-bottom: 12px; }
.hero p { font-size: 1.05rem; color: var(--text-dim); max-width: 640px; margin: 0 auto 24px; }

/* ── Stats bar ── */
.stats-bar {
  display: flex; gap: 32px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 32px;
}
.stat { text-align: center; }
.stat-val {
  font-size: 2rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; display: block;
}
.stat-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

/* ── Controls ── */
.controls {
  max-width: 900px; margin: 0 auto 24px; padding: 0 24px;
}
.search-box {
  width: 100%; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-size: 0.95rem; font-family: var(--sans);
  outline: none; transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-dim); }

.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
}
.filter-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-dim); font-size: 0.8rem;
  cursor: pointer; transition: all 0.2s; font-family: var(--sans);
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { border-color: var(--accent); background: rgba(108,140,255,0.15); color: var(--accent); }

.sort-row {
  display: flex; gap: 8px; margin-top: 10px; align-items: center;
}
.sort-label { font-size: 0.8rem; color: var(--text-dim); }
.sort-btn {
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-dim); font-size: 0.78rem;
  cursor: pointer; transition: all 0.2s; font-family: var(--sans);
}
.sort-btn:hover { border-color: var(--accent); }
.sort-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(108,140,255,0.1); }

/* ── Category headers ── */
.category-header {
  max-width: 900px; margin: 32px auto 12px; padding: 0 24px;
  font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 2px; color: var(--accent2);
}

/* ── Paper cards ── */
.papers-container {
  max-width: 900px; margin: 0 auto; padding: 0 24px;
}
.results-info {
  font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px;
}
.paper-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 14px;
  transition: border-color 0.2s;
}
.paper-card:hover { border-color: rgba(108,140,255,0.4); }

.paper-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; margin-bottom: 8px;
}
.paper-title {
  font-size: 1.05rem; font-weight: 700; color: var(--text);
  line-height: 1.35;
}
.paper-year {
  font-family: var(--mono); font-size: 0.85rem; color: var(--accent);
  white-space: nowrap; flex-shrink: 0;
  padding: 2px 10px; border-radius: 6px;
  background: rgba(108,140,255,0.1);
}

.paper-authors {
  font-size: 0.88rem; color: var(--text-dim); margin-bottom: 8px;
  font-style: italic;
}

.paper-desc {
  font-size: 0.9rem; color: var(--text-dim); margin-bottom: 12px;
  line-height: 1.6;
}

.paper-footer {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}

.paper-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.paper-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.72rem; font-family: var(--mono);
}
.tag-ds { background: rgba(108,140,255,0.12); color: var(--accent); }
.tag-rs { background: rgba(167,139,250,0.12); color: var(--accent2); }
.tag-tdc { background: rgba(52,211,153,0.12); color: var(--accent3); }
.tag-ttt { background: rgba(244,114,182,0.12); color: var(--accent4); }
.tag-fn { background: rgba(251,191,36,0.12); color: var(--accent5); }
.tag-nn { background: rgba(248,113,113,0.12); color: var(--danger); }
.tag-fa { background: rgba(56,189,248,0.12); color: #38bdf8; }
.tag-tg { background: rgba(163,230,53,0.12); color: #a3e635; }
.tag-et { background: rgba(253,186,116,0.12); color: #fdba74; }

.paper-link {
  font-size: 0.85rem; color: var(--accent); text-decoration: none;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
  transition: all 0.2s;
}
.paper-link:hover { border-color: var(--accent); background: rgba(108,140,255,0.1); text-decoration: none; }

/* ── Pagination ── */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; padding: 32px 24px 60px; flex-wrap: wrap;
}
.page-btn {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-dim); font-size: 0.85rem;
  cursor: pointer; transition: all 0.2s; font-family: var(--sans);
  min-width: 40px; text-align: center;
}
.page-btn:hover { border-color: var(--accent); color: var(--text); }
.page-btn.active { border-color: var(--accent); background: rgba(108,140,255,0.15); color: var(--accent); }
.page-btn:disabled { opacity: 0.3; cursor: default; }
.page-info { font-size: 0.85rem; color: var(--text-dim); margin: 0 8px; }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 60px 24px; color: var(--text-dim);
}
.empty-state h3 { color: var(--text); margin-bottom: 8px; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .paper-header { flex-direction: column; gap: 8px; }
  .paper-footer { flex-direction: column; align-items: flex-start; }
  .stats-bar { gap: 20px; }
  .stat-val { font-size: 1.6rem; }
}
</style>

<div class="hero">
  <h1>The Paper Trail</h1>
  <p>Every research paper referenced across The Context Window series — curated with brief descriptions and direct links. One place to find the papers behind the concepts.</p>
  <div class="stats-bar">
    <div class="stat"><span class="stat-val" id="totalCount">—</span><span class="stat-label">Papers</span></div>

<script>
/* ─── Master Paper Database ───
   Each paper: { title, authors, year, desc, url, tags[] }
   Tags map to blog series:
     ds  = Decoding DeepSeek
     rs  = Reasoning from Scratch
     tdc = The Transformer Deep Cuts
     ttt = Tokens, Transformers & Truth
     fn  = Finding Needles
     nn  = Neurons All the Way Down
     fa  = Flash Attention
     tg  = The Training Ground
     et  = The Evolving Transformer
*/
const PAPERS = [

// ═══════════════════════════════════════════════════════════════
// FOUNDATIONAL TRANSFORMER & ATTENTION
// ═══════════════════════════════════════════════════════════════

{
  title: "Attention Is All You Need",
  authors: "Vaswani, Shazeer, Parmar, Uszkoreit, Jones, Gomez, Kaiser, Polosukhin",
  year: 2017,
  desc: "Introduced the Transformer architecture — multi-head self-attention replacing recurrence entirely. The foundation of every modern LLM.",
  url: "https://arxiv.org/abs/1706.03762",
  tags: ["ds","nn","tdc","ttt","tg","et"]
},
{
  title: "Neural Machine Translation by Jointly Learning to Align and Translate",
  authors: "Bahdanau, Cho, Bengio",
  year: 2014,
  desc: "Introduced the attention mechanism for sequence-to-sequence models, allowing the decoder to focus on relevant parts of the input.",
  url: "https://arxiv.org/abs/1409.0473",
  tags: ["ds","ttt"]
},
{
  title: "Long Short-Term Memory",
  authors: "Hochreiter, Schmidhuber",
  year: 1997,
  desc: "The LSTM architecture — gated recurrent cells that solve the vanishing gradient problem in sequence modeling.",
  url: "https://doi.org/10.1162/neco.1997.9.8.1735",
  tags: ["ds"]
},
{
  title: "A Neural Probabilistic Language Model",
  authors: "Bengio, Ducharme, Vincent, Jauvin",
  year: 2003,
  desc: "Pioneered neural language modeling with learned word embeddings and a feedforward architecture. Foundation for all neural LMs.",
  url: "https://www.jmlr.org/papers/v3/bengio03a.html",
  tags: ["nn"]
},

// ═══════════════════════════════════════════════════════════════
// GPT / LANGUAGE MODEL LINEAGE
// ═══════════════════════════════════════════════════════════════

{
  title: "Language Models are Unsupervised Multitask Learners (GPT-2)",
  authors: "Radford, Wu, Child, Luan, Amodei, Sutskever",
  year: 2019,
  desc: "Showed that large language models trained on web text learn to perform diverse tasks without explicit supervision. Introduced byte-level BPE tokenization.",
  url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf",
  tags: ["nn","ttt","et"]
},
{
  title: "Language Models are Few-Shot Learners (GPT-3)",
  authors: "Brown, Mann, Ryder, Subbiah, Kaplan, et al.",
  year: 2020,
  desc: "Demonstrated that scaling to 175B parameters enables in-context learning — performing tasks from a few examples without fine-tuning.",
  url: "https://arxiv.org/abs/2005.14165",
  tags: ["ds","nn","ttt"]
},

// ═══════════════════════════════════════════════════════════════
// PRETRAINING & ENCODERS
// ═══════════════════════════════════════════════════════════════

{
  title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding",
  authors: "Devlin, Chang, Lee, Toutanova",
  year: 2018,
  desc: "Bidirectional pretraining via masked language modeling (MLM) and next sentence prediction. Dominated NLP benchmarks and spawned the encoder-only paradigm.",
  url: "https://arxiv.org/abs/1810.04805",
  tags: ["ds","tdc","ttt","fn"]
},
{
  title: "RoBERTa: A Robustly Optimized BERT Pretraining Approach",
  authors: "Liu, Ott, Goyal, Du, Joshi, Chen, Levy, Lewis, Zettlemoyer, Stoyanov",
  year: 2019,
  desc: "Showed BERT was significantly undertrained. Removed NSP, trained longer with more data, and achieved better results.",
  url: "https://arxiv.org/abs/1907.11692",
  tags: ["ttt","fn"]
},
{
  title: "ELECTRA: Pre-training Text Encoders as Discriminators Rather Than Generators",
  authors: "Clark, Luong, Le, Manning",
  year: 2020,
  desc: "Replaced MLM with replaced token detection — a discriminative pretraining objective that is more sample-efficient than BERT.",
  url: "https://arxiv.org/abs/2003.10555",
  tags: ["ttt"]
},
{
  title: "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks",
  authors: "Reimers, Gurevych",
  year: 2019,
  desc: "Made BERT practical for semantic similarity by training siamese/triplet networks to produce fixed-size sentence embeddings.",
  url: "https://arxiv.org/abs/1908.10084",
  tags: ["tdc","fn"]
},

// ═══════════════════════════════════════════════════════════════
// SCALING LAWS
// ═══════════════════════════════════════════════════════════════

{
  title: "Scaling Laws for Neural Language Models",
  authors: "Kaplan, McCandlish, Henighan, Brown, Chess, Child, Gray, Radford, Wu, Amodei",
  year: 2020,
  desc: "Established power-law relationships between model size, dataset size, compute budget, and loss. Showed performance scales predictably.",
  url: "https://arxiv.org/abs/2001.08361",
  tags: ["ttt","nn"]
},
{
  title: "Training Compute-Optimal Large Language Models (Chinchilla)",
  authors: "Hoffmann, Borgeaud, Mensch, Buchatskaya, Cai, Rutherford, et al.",
  year: 2022,
  desc: "Showed most LLMs were undertrained relative to their size. The Chinchilla scaling law: tokens should scale linearly with parameters.",
  url: "https://arxiv.org/abs/2203.15556",
  tags: ["ttt","nn"]
},

// ═══════════════════════════════════════════════════════════════
// POSITION ENCODING
// ═══════════════════════════════════════════════════════════════

{
  title: "RoFormer: Enhanced Transformer with Rotary Position Embedding",
  authors: "Su, Lu, Pan, Murtadha, Wen, Liu",
  year: 2021,
  desc: "Introduced RoPE — encoding position via rotation matrices applied to Q/K vectors. Enables relative position awareness and length extrapolation.",
  url: "https://arxiv.org/abs/2104.09864",
  tags: ["ds","tdc","ttt","tg"]
},
{
  title: "YaRN: Efficient Context Window Extension of Large Language Models",
  authors: "Peng, Quesnelle, Fan, Shippole",
  year: 2023,
  desc: "Extended RoPE-based models to longer contexts by adjusting frequency scaling per dimension. Enables 128K+ context without retraining from scratch.",
  url: "https://arxiv.org/abs/2309.00071",
  tags: ["tg"]
},

// ═══════════════════════════════════════════════════════════════
// NORMALIZATION & FFN VARIANTS
// ═══════════════════════════════════════════════════════════════

{
  title: "Root Mean Square Layer Normalization",
  authors: "Zhang, Sennrich",
  year: 2019,
  desc: "Simplified LayerNorm by removing the mean-centering step. RMSNorm is cheaper to compute and used in LLaMA, DeepSeek, and most modern LLMs.",
  url: "https://arxiv.org/abs/1910.07467",
  tags: ["tdc","tg"]
},
{
  title: "GLU Variants Improve Transformer",
  authors: "Shazeer",
  year: 2020,
  desc: "Showed that gated linear unit variants (GEGLU, SwiGLU) outperform standard ReLU FFNs in Transformers. SwiGLU is now the default in LLaMA-family models.",
  url: "https://arxiv.org/abs/2002.05202",
  tags: ["tdc","tg"]
},

// ═══════════════════════════════════════════════════════════════
// EFFICIENT ATTENTION (KV CACHE, MQA, GQA)
// ═══════════════════════════════════════════════════════════════

{
  title: "Fast Transformer Decoding: One Write-Head is All You Need (MQA)",
  authors: "Shazeer",
  year: 2019,
  desc: "Multi-Query Attention — all heads share a single K/V projection. Dramatically reduces KV cache memory and speeds up inference.",
  url: "https://arxiv.org/abs/1911.02150",
  tags: ["ds","tdc"]
},
{
  title: "GQA: Training Generalized Multi-Query Models from Multi-Head Checkpoints",
  authors: "Ainslie, Lee-Thorp, de Jong, Zemlyanskiy, Lebrón, Sanghai",
  year: 2023,
  desc: "Grouped-Query Attention — a middle ground between MHA and MQA. Groups of heads share K/V projections. Used in LLaMA 2 70B and most modern LLMs.",
  url: "https://arxiv.org/abs/2305.13245",
  tags: ["ds","tdc"]
},

// ═══════════════════════════════════════════════════════════════
// FLASH ATTENTION
// ═══════════════════════════════════════════════════════════════

{
  title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness",
  authors: "Dao, Fu, Ermon, Rudra, Ré",
  year: 2022,
  desc: "Reformulated attention computation to be IO-aware — tiling Q/K/V to exploit GPU SRAM, achieving 2-4x speedup with no approximation.",
  url: "https://arxiv.org/abs/2205.14135",
  tags: ["ds","nn","fa","tdc"]
},
{
  title: "FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning",
  authors: "Dao",
  year: 2023,
  desc: "Improved parallelism over sequence length and reduced non-matmul FLOPs. 2x faster than FA-1, reaching 50-73% of theoretical peak.",
  url: "https://arxiv.org/abs/2307.08691",
  tags: ["nn","fa"]
},
{
  title: "FlashAttention-3: Fast and Accurate Attention with Asynchrony and Low-precision",
  authors: "Shah, Bikshandi, Zhang, Thakkar, Ramani, Dao",
  year: 2024,
  desc: "Exploited Hopper GPU features — warp specialization, FP8 tensor cores, and asynchronous pipelining — for further speedups.",
  url: "https://arxiv.org/abs/2407.08608",
  tags: ["fa"]
},
{
  title: "FlashAttention-4: Algorithm and Kernel Pipelining Co-Design for Asymmetric Hardware",
  authors: "Zadouri, Hoehnerbach, Shah, Liu, Thakkar, Dao",
  year: 2026,
  desc: "Co-designed algorithm and GPU kernel pipelining for Blackwell-generation hardware with asymmetric compute/memory scaling.",
  url: "https://arxiv.org/abs/2603.05451",
  tags: ["fa"]
},

// ═══════════════════════════════════════════════════════════════
// MIXTURE OF EXPERTS
// ═══════════════════════════════════════════════════════════════

{
  title: "Adaptive Mixtures of Local Experts",
  authors: "Jacobs, Jordan, Nowlan, Hinton",
  year: 1991,

// ─── Tag metadata ───
const TAG_META = {
  ds:  { label: "Decoding DeepSeek",       cls: "tag-ds"  },
  rs:  { label: "Reasoning from Scratch",   cls: "tag-rs"  },
  tdc: { label: "Transformer Deep Cuts",    cls: "tag-tdc" },
  ttt: { label: "Tokens Transformers Truth",cls: "tag-ttt" },
  fn:  { label: "Finding Needles",          cls: "tag-fn"  },
  nn:  { label: "Neurons Zero to Hero",     cls: "tag-nn"  },
  fa:  { label: "Flash Attention",          cls: "tag-fa"  },
  tg:  { label: "The Training Ground",      cls: "tag-tg"  },
  et:  { label: "Evolving Transformer",     cls: "tag-et"  }
};

// ─── State ───
const PER_PAGE = 10;
let currentPage = 1;
let activeFilter = "all";
let activeSort = "year-desc";
let searchQuery = "";

// ─── Init ───
function init() {
  // Stats
  document.getElementById("totalCount").textContent = PAPERS.length;
  const allTags = new Set();
  PAPERS.forEach(p => p.tags.forEach(t => allTags.add(t)));
  document.getElementById("seriesCount").textContent = allTags.size;
  const years = PAPERS.map(p => p.year).filter(Boolean);
  document.getElementById("yearSpan").textContent =
    Math.min(...years) + "–" + Math.max(...years);

  // Build filter buttons
  const filterRow = document.getElementById("filterRow");
  let html = '<button class="filter-btn active" data-filter="all">All</button>';
  for (const [key, meta] of Object.entries(TAG_META)) {
    const count = PAPERS.filter(p => p.tags.includes(key)).length;
    if (count > 0) {
      html += `<button class="filter-btn" data-filter="${key}">${meta.label} (${count})</button>`;
    }
  }
  filterRow.innerHTML = html;

  // Event listeners
  filterRow.addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    filterRow.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    activeFilter = e.target.dataset.filter;
    currentPage = 1;
    render();
  });

  document.getElementById("searchBox").addEventListener("input", e => {
    searchQuery = e.target.value.toLowerCase().trim();
    currentPage = 1;
    render();
  });

  document.querySelectorAll(".sort-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeSort = btn.dataset.sort;
      currentPage = 1;
      render();
    });
  });

  render();
}

// ─── Filter & sort ───
function getFiltered() {
  let papers = [...PAPERS];

  // Filter by tag
  if (activeFilter !== "all") {
    papers = papers.filter(p => p.tags.includes(activeFilter));
  }

  // Search
  if (searchQuery) {
    papers = papers.filter(p => {
      const hay = (p.title + " " + p.authors + " " + p.desc + " " + p.year).toLowerCase();
      return searchQuery.split(/\s+/).every(w => hay.includes(w));
    });
  }

  // Sort
  if (activeSort === "year-desc") {
    papers.sort((a, b) => (b.year || 0) - (a.year || 0));
  } else if (activeSort === "year-asc") {
    papers.sort((a, b) => (a.year || 0) - (b.year || 0));
  } else {
    papers.sort((a, b) => a.title.localeCompare(b.title));
  }

  return papers;
}

// ─── Render ───
function render() {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PER_PAGE;
  const page = filtered.slice(start, start + PER_PAGE);

  // Results info
  const info = document.getElementById("resultsInfo");
  if (searchQuery || activeFilter !== "all") {
    info.textContent = `Showing ${filtered.length} of ${PAPERS.length} papers`;
  } else {
    info.textContent = `${PAPERS.length} papers · Page ${currentPage} of ${totalPages}`;
  }

  // Paper cards
  const list = document.getElementById("paperList");
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><h3>No papers found</h3><p>Try a different search or filter.</p></div>';
  } else {
    list.innerHTML = page.map(p => {
      const tags = p.tags.map(t => {
        const m = TAG_META[t];
        return m ? `<span class="paper-tag ${m.cls}">${m.label}</span>` : "";
      }).join("");

      const link = p.url
        ? `<a class="paper-link" href="${p.url}" target="_blank" rel="noopener">Read Paper →</a>`
        : `<span style="font-size:0.8rem;color:var(--text-dim);">No link available</span>`;

      return `
        <div class="paper-card">
          <div class="paper-header">
            <div class="paper-title">${p.title}</div>
            <span class="paper-year">${p.year || "—"}</span>
          </div>
          <div class="paper-authors">${p.authors}</div>
          <div class="paper-desc">${p.desc}</div>
          <div class="paper-footer">
            <div class="paper-tags">${tags}</div>
            ${link}
          </div>
        </div>
      `;
    }).join("");
  }

  // Pagination
  const pag = document.getElementById("pagination");
  if (totalPages <= 1) { pag.innerHTML = ""; return; }

  let pagHtml = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>← Prev</button>`;

  // Page numbers with ellipsis
  const maxVisible = 7;
  let pages = [];
  if (totalPages <= maxVisible) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (currentPage > 3) pages.push("…");
    for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) {
      pages.push(i);
    }
    if (currentPage < totalPages - 2) pages.push("…");
    pages.push(totalPages);
  }

  pages.forEach(p => {
    if (p === "…") {
      pagHtml += `<span class="page-info">…</span>`;
    } else {
      pagHtml += `<button class="page-btn ${p === currentPage ? "active" : ""}" onclick="goPage(${p})">${p}</button>`;
    }
  });

  pagHtml += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>Next →</button>`;
  pag.innerHTML = pagHtml;
}

function goPage(n) {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (n < 1 || n > totalPages) return;
  currentPage = n;
  render();
  window.scrollTo({ top: document.querySelector(".controls").offsetTop - 60, behavior: "smooth" });
}

init();
</script>
<script>
(function(){
  var btn  = document.getElementById('themeToggle');
  var root = document.documentElement;
  if (!btn) return;
  btn.addEventListener('click', function(){
    var isLight = root.getAttribute('data-theme') === 'light';
    if (isLight) {
      root.removeAttribute('data-theme');
      localStorage.setItem('tcw-theme','dark');
    } else {
      root.setAttribute('data-theme','light');
      localStorage.setItem('tcw-theme','light');
    }
  });
})();
</script>
